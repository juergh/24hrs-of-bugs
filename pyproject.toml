[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
files = ["common.py", "fetch-bugs.py", "render-html.py", "tests"]
exclude = [
    "^cktools_data/",
]
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "cktools_data.*"
ignore_errors = true

[tool.ruff]
line-length = 118
indent-width = 4
target-version = "py312"
extend-exclude = [
    "cktools_data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
